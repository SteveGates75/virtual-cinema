<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎬 Virtual Cinema</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ══════════════════════════════════════════════════
       LOGIN SCREEN
  ══════════════════════════════════════════════════ -->
  <div id="login-screen" class="screen active">
    <div class="login-backdrop"></div>
    <div class="login-card">
      <div class="login-logo">
        <span class="logo-icon">🎬</span>
        <h1>Virtual Cinema</h1>
        <p>Your private screening room</p>
      </div>
      <div class="login-form">
        <div class="input-group">
          <label for="login-name">Your name</label>
          <input id="login-name" type="text" placeholder="e.g. Alex" maxlength="20" autocomplete="off" />
        </div>
        <div class="input-group">
          <label for="login-password">Room password</label>
          <input id="login-password" type="password" placeholder="Enter password" autocomplete="current-password" />
        </div>
        <button id="login-btn" class="btn btn-primary">Enter Room</button>
        <p id="login-error" class="error-msg hidden"></p>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════════
       CINEMA SCREEN
  ══════════════════════════════════════════════════ -->
  <div id="cinema-screen" class="screen">

    <!-- Top Bar -->
    <header class="topbar">
      <div class="topbar-left">
        <span class="topbar-logo">🎬</span>
        <span class="topbar-title">Virtual Cinema</span>
        <div id="connection-badge" class="badge badge-connecting">Connecting…</div>
      </div>
      <div class="topbar-center" id="room-status">Waiting for partner…</div>
      <div class="topbar-right">
        <button id="settings-btn" class="icon-btn" title="Video Quality">⚙️</button>
        <button id="leave-btn" class="icon-btn danger" title="Leave room">✕</button>
      </div>
    </header>

    <!-- Settings Dropdown -->
    <div id="settings-panel" class="settings-panel hidden">
      <h4>Stream Quality</h4>
      <div class="quality-options">
        <button class="quality-btn" data-res="1080">1080p · 30fps</button>
        <button class="quality-btn active" data-res="720">720p · 30fps</button>
        <button class="quality-btn" data-res="480">480p · 24fps</button>
        <button class="quality-btn" data-res="360">360p · 24fps</button>
      </div>
      <p class="settings-note">Applied to your next screen share or video file stream.</p>
    </div>

    <!-- Main Layout -->
    <main class="cinema-layout">

      <!-- Media Stage -->
      <section class="stage-area">
        <div id="stage" class="stage">
          <div id="stage-placeholder" class="stage-placeholder">
            <div class="placeholder-icon">🎥</div>
            <p>No stream active</p>
            <small>Start a screen share or load a video file below</small>
          </div>
          <!-- Remote stream fills this -->
          <video id="remote-video" class="stage-video hidden" autoplay playsinline></video>
          <!-- Local screen share preview (small pip) -->
          <video id="local-stream-pip" class="pip-preview hidden" autoplay playsinline muted></video>
          <!-- Fullscreen overlay controls (shown on hover when stream is active) -->
          <div id="stage-overlay" class="stage-overlay hidden">
            <button id="fullscreen-btn" class="fullscreen-btn" title="Full Screen (F)">
              <svg id="fs-enter-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/>
                <line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>
              </svg>
              <svg id="fs-exit-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden">
                <polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/>
                <line x1="10" y1="14" x2="3" y2="21"/><line x1="21" y1="3" x2="14" y2="10"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Stage Controls -->
        <div class="stage-controls">
          <button id="screenshare-btn" class="ctrl-btn" title="Share Screen">
            <span class="ctrl-icon">🖥️</span> Share Screen
          </button>
          <label id="file-btn" class="ctrl-btn" title="Stream Video File">
            <span class="ctrl-icon">📁</span> Video File
            <input id="file-input" type="file" accept="video/*" hidden />
          </label>
          <button id="stop-stream-btn" class="ctrl-btn danger hidden" title="Stop Stream">
            <span class="ctrl-icon">⏹</span> Stop Stream
          </button>
        </div>
      </section>

      <!-- Right Sidebar -->
      <aside class="sidebar">

        <!-- Camera Views -->
        <div class="cameras-section">
          <div class="camera-wrap">
            <video id="local-cam" class="cam-video" autoplay playsinline muted></video>
            <div class="cam-label">You</div>
            <div class="cam-controls">
              <button id="toggle-cam" class="cam-btn active" title="Camera">📷</button>
              <button id="toggle-mic" class="cam-btn active" title="Mic">🎤</button>
            </div>
          </div>
          <div class="camera-wrap remote">
            <video id="remote-cam" class="cam-video" autoplay playsinline></video>
            <div id="remote-cam-label" class="cam-label">Partner</div>
            <div id="remote-cam-placeholder" class="cam-placeholder">
              <span>👤</span>
              <small>Waiting…</small>
            </div>
          </div>
        </div>

        <!-- Chat -->
        <div class="chat-section">
          <div class="chat-header">
            <span>💬 Chat</span>
            <span id="online-count" class="online-count">1 online</span>
          </div>
          <div id="chat-messages" class="chat-messages"></div>
          <div class="chat-input-row">
            <input id="chat-input" type="text" placeholder="Say something…" maxlength="500" autocomplete="off" />
            <button id="chat-send" class="send-btn">↑</button>
          </div>
        </div>

      </aside>
    </main>
  </div>

  <!-- Toast notifications -->
  <div id="toast-container" class="toast-container"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
